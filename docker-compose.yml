# Try it in one command:
#     docker compose up
# then open http://localhost:8000 and sign in with demo / demo1234demo
#
# The first start generates a fictional demo dataset and builds the database,
# which takes a minute or two. Later starts reuse the volume and are instant.

services:
  catalogue:
    build: .
    image: enda-catalogue-db
    ports:
      # Override the host port if 8000 is taken:  HOST_PORT=8080 docker compose up
      - "${HOST_PORT:-8000}:8000"
    environment:
      # Generate and load the fictional demo dataset
      DEMO: "1"
      # Shows the credentials on the sign-in page and disables account changes.
      # Turn this off for a real installation.
      DEMO_MODE: "1"
      ADMIN_USER: "demo"
      ADMIN_PASSWORD: "demo1234demo"
    volumes:
      # The database is rebuilt from the source data, but keeping it means the
      # container does not have to rebuild on every start.
      - catalogue-data:/app/data
    restart: unless-stopped

volumes:
  catalogue-data:

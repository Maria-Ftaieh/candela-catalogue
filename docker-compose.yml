# Production deployment.
#
#   1. Put your BMEcat XML and PDFs under brands/<code>/  (see brands/README.md)
#   2. docker compose up -d
#   3. Read the generated administrator password from the logs
#
# The first start builds the database from whatever is in brands/, which for a full
# manufacturer catalogue takes a couple of minutes. Later starts reuse the volume.
#
# Just want to look at it? Use the demo instead:
#   docker compose -f docker-compose.demo.yml up

services:
  candela:
    build:
      context: .
      args:
        # Set to 1 to include Playwright + Chromium (~400 MB) so that
        # etl/fetch_trilux.py can download from the manufacturer portal.
        WITH_BROWSER: "${WITH_BROWSER:-0}"
    image: candela
    ports:
      # Only bind to localhost; put a reverse proxy in front for TLS.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      # First administrator. Leave the password empty and one is generated and
      # printed once in the logs; either way it must be changed on first sign-in.
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      # Your source data. Must be writable by uid 10001 if you want the container
      # to run etl/fetch_trilux.py itself (needs WITH_BROWSER=1).
      - ./brands:/app/brands
      # The generated database. A named volume avoids host permission problems.
      - candela-data:/app/data
      # Manufacturer portal credentials, if you use the automatic download:
      # - /etc/trilux:/etc/trilux:ro
    restart: unless-stopped

volumes:
  candela-data:
